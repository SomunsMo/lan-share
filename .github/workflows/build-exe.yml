name: Build All Platforms

on:
  workflow_dispatch:            # 手动触发
  push:
    tags: ["v*"]                # 推送 tag 时自动触发（如 v1.0.0）

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
            ext: .exe
            bundles: ""               # 免安装，只产裸 exe

          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x86_64
            ext: ""
            bundles: "app,dmg"

          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-aarch64
            ext: ""
            bundles: "app,dmg"

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
            ext: ""
            bundles: "deb,rpm"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # --- Node.js + pnpm ---
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            src-web/pnpm-lock.yaml

      # --- Rust ---
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # --- Linux 系统库（GTK + WebKit，Tauri 编译必需）---
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            rpm

      # --- 安装前端依赖 ---
      - name: Install dependencies
        run: |
          pnpm install
          cd src-web && pnpm install

      # --- 使用 pnpm tauri build 构建 ---
      # build.rs 会自动构建 src-web 前端并嵌入到可执行程序
      # macOS: 利用 tauri.conf.json 的 "targets": "all" 自动打包 app + dmg
      - name: Build (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: pnpm tauri build -v -t ${{ matrix.target }}

      # Linux: 构建 deb + rpm 包
      - name: Build (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: pnpm tauri build -v -t ${{ matrix.target }} --bundles deb,rpm

      # Windows: 只产裸 exe
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: pnpm tauri build -v -t ${{ matrix.target }} --no-bundle

      # --- 检查 bundle 输出（确认打包产物是否生成）---
      - name: List bundle output
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "=== Bundle output ==="
          find "target/${{ matrix.target }}/release/bundle" -type f 2>/dev/null || echo "(no bundle files)"

      # --- UPX 压缩（仅 Windows，减小 .exe 体积）---
      - name: Install UPX
        if: runner.os == 'Windows'
        shell: bash
        run: choco install upx -y

      - name: Compress binary with UPX
        if: runner.os == 'Windows'
        shell: bash
        run: |
          BINARY="target/${{ matrix.target }}/release/lan-share${{ matrix.ext }}"
          SIZE_BEFORE=$(wc -c < "$BINARY")
          echo "Size before UPX: $SIZE_BEFORE bytes"
          if upx --best --lzma "$BINARY"; then
            SIZE_AFTER=$(wc -c < "$BINARY")
            echo "UPX compressed: $SIZE_BEFORE → $SIZE_AFTER bytes (saved $(( SIZE_BEFORE - SIZE_AFTER )) bytes)"
          else
            echo "::warning::UPX compression failed, uploading uncompressed binary"
          fi

      # --- 上传原始可执行文件（仅 Windows，直接分发 .exe）---
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: lan-share_${{ matrix.name }}
          path: target/${{ matrix.target }}/release/lan-share${{ matrix.ext }}
          compression-level: 0

      # --- 上传 DMG（macOS 额外上传 dmg 安装包）---
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: lan-share_${{ matrix.name }}-dmg
          path: target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          compression-level: 0
          if-no-files-found: warn

      # --- 上传 .app bundle（macOS 额外上传应用程序包）---
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: lan-share_${{ matrix.name }}-app
          path: target/${{ matrix.target }}/release/bundle/macos/*.app
          compression-level: 0
          if-no-files-found: warn

      # --- 上传 deb + rpm（Linux 额外上传两种包格式）---
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: lan-share_${{ matrix.name }}-deb
          path: target/${{ matrix.target }}/release/bundle/deb/*.deb
          compression-level: 0
          if-no-files-found: warn

      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: lan-share_${{ matrix.name }}-rpm
          path: target/${{ matrix.target }}/release/bundle/rpm/*.rpm
          compression-level: 0
          if-no-files-found: warn