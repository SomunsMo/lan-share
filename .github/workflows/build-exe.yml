name: Build All Platforms

on:
  workflow_dispatch:            # 手动触发
  push:
    tags: ["v*"]                # 推送 tag 时自动触发（如 v1.0.0）

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
            ext: .exe

          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-intel
            ext: ""

          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm
            ext: ""

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x64
            ext: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # --- Node.js + pnpm ---
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            src-web/pnpm-lock.yaml

      # --- Rust ---
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # --- Linux 系统库（GTK + WebKit，Tauri 编译必需）---
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev

      # --- 安装前端依赖 ---
      - name: Install dependencies
        run: |
          pnpm install
          cd src-web && pnpm install

      # --- 构建桌面前端（Tauri React UI）---
      # tauri.conf.json 的 beforeBuildCommand 只被 tauri build 执行，
      # cargo build 不会触发它，而 generate_context!() 编译时依赖 dist/ 目录
      - name: Build desktop frontend
        run: pnpm run build

      # --- 编译 Rust（build.rs 会自动构建 src-web 前端并嵌入）---
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p lan-share

      # --- UPX 极限体积压缩 ---
      - name: Install UPX
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)  sudo apt-get -y install upx-ucl ;;
            macOS)  brew install upx ;;
            Windows) choco install upx -y ;;
          esac

      - name: Compress binary with UPX
        shell: bash
        run: |
          BINARY="target/${{ matrix.target }}/release/lan-share${{ matrix.ext }}"
          SIZE_BEFORE=$(wc -c < "$BINARY")
          echo "Size before UPX: $SIZE_BEFORE bytes"
          if upx --best --lzma "$BINARY"; then
            SIZE_AFTER=$(wc -c < "$BINARY")
            echo "UPX compressed: $SIZE_BEFORE → $SIZE_AFTER bytes (saved $(( SIZE_BEFORE - SIZE_AFTER )) bytes)"
          else
            echo "::warning::UPX compression failed, uploading uncompressed binary"
          fi

      # --- 上传产物 ---
      - uses: actions/upload-artifact@v4
        with:
          name: lan-share-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/lan-share${{ matrix.ext }}
          compression-level: 0