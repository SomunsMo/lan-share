name: Build All Platforms

on:
  workflow_dispatch:            # 手动触发
  push:
    tags: ["v*"]                # 推送 tag 时自动触发（如 v1.0.0）

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
            ext: .exe
            bundles: ""               # 免安装，只产裸 exe

          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x86_64
            ext: ""
            bundles: "app,dmg"

          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-aarch64
            ext: ""
            bundles: "app,dmg"

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
            ext: ""
            bundles: "deb,rpm"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # --- Node.js + pnpm ---
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            src-web/pnpm-lock.yaml

      # --- Rust ---
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # --- Linux 系统库（GTK + WebKit，Tauri 编译必需）---
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            rpm

      # --- 安装前端依赖 ---
      - name: Install dependencies
        run: |
          pnpm install
          cd src-web && pnpm install

      # --- 使用 pnpm tauri build 构建 ---
      # build.rs 会自动构建 src-web 前端并嵌入到可执行程序
      # macOS: 利用 tauri.conf.json 的 "targets": "all" 自动打包 app + dmg
      - name: Build (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: pnpm tauri build -v -t ${{ matrix.target }}

      # Linux: 构建 deb + rpm 包
      - name: Build (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: pnpm tauri build -v -t ${{ matrix.target }} --bundles deb,rpm

      # Windows: 只产裸 exe
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: pnpm tauri build -v -t ${{ matrix.target }} --no-bundle

      # --- 检查 bundle 输出（确认打包产物是否生成）---
      - name: List bundle output
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "=== Bundle output ==="
          find "target/${{ matrix.target }}/release/bundle" -type f 2>/dev/null || echo "(no bundle files)"

      # --- UPX 压缩（仅 Windows，减小 .exe 体积）---
      - name: Install UPX
        if: runner.os == 'Windows'
        shell: bash
        run: choco install upx -y

      - name: Compress binary with UPX
        if: runner.os == 'Windows'
        shell: bash
        run: |
          BINARY="target/${{ matrix.target }}/release/lan-share${{ matrix.ext }}"
          SIZE_BEFORE=$(wc -c < "$BINARY")
          echo "Size before UPX: $SIZE_BEFORE bytes"
          if upx --best --lzma "$BINARY"; then
            SIZE_AFTER=$(wc -c < "$BINARY")
            echo "UPX compressed: $SIZE_BEFORE → $SIZE_AFTER bytes (saved $(( SIZE_BEFORE - SIZE_AFTER )) bytes)"
          else
            echo "::warning::UPX compression failed, uploading uncompressed binary"
          fi

      # --- 上传原始可执行文件（仅 Windows，直接分发 .exe）---
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: lan-share_${{ matrix.name }}
          path: target/${{ matrix.target }}/release/lan-share${{ matrix.ext }}
          compression-level: 0

      # --- 上传 DMG（macOS 额外上传 dmg 安装包）---
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: lan-share_${{ matrix.name }}-dmg
          path: target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          compression-level: 0
          if-no-files-found: warn

      # --- 上传 .app bundle（macOS 额外上传应用程序包）---
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: lan-share_${{ matrix.name }}-app
          path: target/${{ matrix.target }}/release/bundle/macos/*.app
          compression-level: 0
          if-no-files-found: warn

      # --- 上传 deb + rpm（Linux 额外上传两种包格式）---
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: lan-share_${{ matrix.name }}-deb
          path: target/${{ matrix.target }}/release/bundle/deb/*.deb
          compression-level: 0
          if-no-files-found: warn

      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: lan-share_${{ matrix.name }}-rpm
          path: target/${{ matrix.target }}/release/bundle/rpm/*.rpm
          compression-level: 0
          if-no-files-found: warn

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version consistency
        run: |
          CARGO_VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed -n 's/.*"\(.*\)".*/\1/p')
          TAG_VERSION="${{ github.ref_name }}"
          TAG_VERSION_CLEAN="${TAG_VERSION#v}"
          # Strip pre-release suffix for comparison (e.g., "1.0.2-test.1" -> "1.0.2")
          TAG_VERSION_BASE="${TAG_VERSION_CLEAN%%-*}"
          if [ "$CARGO_VERSION" != "$TAG_VERSION_BASE" ]; then
            echo "::error::Tag '${TAG_VERSION}' does not match Cargo.toml version '${CARGO_VERSION}'"
            echo "Please update src-tauri/Cargo.toml version to ${TAG_VERSION_BASE} before pushing the tag."
            exit 1
          fi
          echo "Version consistency verified: v${CARGO_VERSION} (tag: ${TAG_VERSION})"

      - name: Generate changelog
        run: |
          CURRENT_TAG="${{ github.ref_name }}"
          PREVIOUS_TAG=$(git tag --sort=-version:refname --list 'v*' | grep -v "^${CURRENT_TAG}$" | head -n 1)
          {
            echo "# ${CURRENT_TAG}"
            echo ""
            if [ -z "$PREVIOUS_TAG" ]; then
              echo "> First release of LAN Share."
              echo ""
              git log --pretty=format:"- %s (\`%h\`)" --no-merges
            else
              echo "> Changes since \`${PREVIOUS_TAG}\`"
              echo ""
              COMMIT_COUNT=$(git rev-list --count --no-merges ${PREVIOUS_TAG}..HEAD)
              echo "**${COMMIT_COUNT} commits** since the previous release."
              echo ""
              COMMITS=$(git log --pretty=format:"- %s (\`%h\`)" --no-merges ${PREVIOUS_TAG}..HEAD)
              if [ -z "$COMMITS" ]; then
                echo "(no changes since previous tag)"
              else
                echo "$COMMITS"
              fi
            fi
          } > /tmp/changelog.md

      - uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release-assets

          for dir in all-artifacts/*/; do
            artifact_name="$(basename "$dir")"          # e.g. "lan-share_windows-x86_64"
            platform_part="${artifact_name#lan-share_}"  # e.g. "windows-x86_64"

            # Case 1: macOS .app bundle → zip with platform-specific name
            app_bundle="$(find "$dir" -maxdepth 1 -name "*.app" -type d -print -quit 2>/dev/null || true)"
            if [ -n "$app_bundle" ]; then
              # platform_part is like "macos-x86_64-app" or "macos-aarch64-app"
              platform="${platform_part%-app}"           # → "macos-x86_64" / "macos-aarch64"
              app_name="$(basename "$app_bundle")"
              zip_name="lan-share_${platform}.app.zip"
              echo "Zipping ${app_name} → ${zip_name}"
              (cd "$(dirname "$app_bundle")" && zip -rq "${GITHUB_WORKSPACE}/release-assets/${zip_name}" "$app_name")
              continue
            fi

            # Case 2: regular files — rename to consistent convention
            for file in "$dir"/*; do
              [ -f "$file" ] || continue
              case "$platform_part" in
                windows-x86_64)
                  zip_name="lan-share_windows-x86_64.zip"
                  echo "Zipping → ${zip_name}"
                  zip -j "${GITHUB_WORKSPACE}/release-assets/${zip_name}" "$file"
                  ;;
                macos-*-dmg)
                  plat="${platform_part%-dmg}"
                  zip_name="lan-share_${plat}.dmg.zip"
                  echo "Zipping → ${zip_name}"
                  zip -j "${GITHUB_WORKSPACE}/release-assets/${zip_name}" "$file"
                  ;;
                linux-*-deb)
                  plat="${platform_part%-deb}"
                  zip_name="lan-share_${plat}.deb.zip"
                  echo "Zipping → ${zip_name}"
                  zip -j "${GITHUB_WORKSPACE}/release-assets/${zip_name}" "$file"
                  ;;
                linux-*-rpm)
                  plat="${platform_part%-rpm}"
                  zip_name="lan-share_${plat}.rpm.zip"
                  echo "Zipping → ${zip_name}"
                  zip -j "${GITHUB_WORKSPACE}/release-assets/${zip_name}" "$file"
                  ;;
              esac
            done
          done

          echo "=== Release assets ==="
          ls -lh release-assets/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: /tmp/changelog.md
          files: release-assets/*
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}