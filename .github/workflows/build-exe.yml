name: Build All Platforms

on:
  workflow_dispatch:            # 手动触发
  push:
    tags: ["v*"]                # 推送 tag 时自动触发（如 v1.0.0）

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
            ext: .exe
            bundles: ""               # 免安装，只产裸 exe

          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-intel
            ext: ""
            bundles: "app,dmg"

          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm
            ext: ""
            bundles: "app,dmg"

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x64
            ext: ""
            bundles: "appimage"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # --- Node.js + pnpm ---
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            src-web/pnpm-lock.yaml

      # --- Rust ---
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # --- Linux 系统库（GTK + WebKit，Tauri 编译必需）---
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev

      # --- 安装前端依赖 ---
      - name: Install dependencies
        run: |
          pnpm install
          cd src-web && pnpm install

      # --- 使用 pnpm tauri build 构建（自动执行 beforeBuildCommand + 编译 + 打包）---
      # build.rs 会自动构建 src-web 前端并嵌入到可执行程序
      - name: Build with bundles
        if: matrix.bundles != ''
        shell: bash
        run: pnpm tauri build -t ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Build without bundles (Windows)
        if: matrix.bundles == ''
        shell: bash
        run: pnpm tauri build -t ${{ matrix.target }} --no-bundle

      # --- UPX 压缩（Win/Linux，减小可执行文件体积）---
      - name: Install UPX
        if: runner.os != 'macOS'
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)  sudo apt-get -y install upx-ucl ;;
            Windows) choco install upx -y ;;
          esac

      - name: Compress binary with UPX
        if: runner.os != 'macOS'
        shell: bash
        run: |
          BINARY="target/${{ matrix.target }}/release/lan-share${{ matrix.ext }}"
          SIZE_BEFORE=$(wc -c < "$BINARY")
          echo "Size before UPX: $SIZE_BEFORE bytes"
          if upx --best --lzma "$BINARY"; then
            SIZE_AFTER=$(wc -c < "$BINARY")
            echo "UPX compressed: $SIZE_BEFORE → $SIZE_AFTER bytes (saved $(( SIZE_BEFORE - SIZE_AFTER )) bytes)"
          else
            echo "::warning::UPX compression failed, uploading uncompressed binary"
          fi

      # --- 上传原始可执行文件（所有平台）---
      - uses: actions/upload-artifact@v4
        with:
          name: lan-share-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/lan-share${{ matrix.ext }}
          compression-level: 0

      # --- 上传 DMG（macOS 额外上传 dmg 安装包）---
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: lan-share-${{ matrix.name }}-dmg
          path: target/${{ matrix.target }}/release/bundle/macos/*.dmg
          compression-level: 0

      # --- 上传 AppImage（Linux 额外上传 AppImage 通用包）---
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: lan-share-${{ matrix.name }}-appimage
          path: target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          compression-level: 0