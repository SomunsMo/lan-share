name: Build All Platforms and Fill Release Draft

on:
  workflow_dispatch:            # 仅手动触发

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      fill: ${{ steps.check.outputs.fill }}

    steps:
      - uses: actions/checkout@v4

      # 仅 main 分支走发布路径：按 main 的版本号定位待填充的 release 草稿。
      # 其他分支只是用来编译验证跨平台产物，不校验版本、不接触 release。
      - name: Check release draft
        id: check
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CARGO_VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed -n 's/.*"\(.*\)".*/\1/p')
          TAURI_VERSION=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          if [ -z "$CARGO_VERSION" ] || [ -z "$TAURI_VERSION" ]; then
            echo "::error::无法读取版本号（Cargo.toml='${CARGO_VERSION}' tauri.conf.json='${TAURI_VERSION}'）"
            exit 1
          fi
          if [ "$CARGO_VERSION" != "$TAURI_VERSION" ]; then
            echo "::error::Cargo.toml (${CARGO_VERSION}) 与 tauri.conf.json (${TAURI_VERSION}) 版本号不一致"
            exit 1
          fi

          TAG="v${CARGO_VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if ! IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            echo "未找到 ${TAG} 的 release，本次只构建，不填充。"
            echo "fill=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$IS_DRAFT" != "true" ]; then
            echo "::warning::${TAG} 已发布，release 资产不可变，本次只构建，不填充。"
            echo "fill=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "找到草稿 ${TAG}，构建完成后将填充二进制。"
          echo "fill=true" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
            ext: .exe
            bundles: ""               # 免安装，只产裸 exe

          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x86_64
            ext: ""
            bundles: "dmg"

          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-aarch64
            ext: ""
            bundles: "dmg"

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
            ext: ""
            bundles: "deb,rpm"

    runs-on: ${{ matrix.os }}

    steps:
      # 填充 release 时以 tag 为准构建，保证产物与 tag 指向的 commit 一致；
      # 其余情况构建触发时所选的 ref
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag || github.ref }}

      # --- Node.js + pnpm ---
      # 不指定 version：pnpm/action-setup 会自动读取 package.json 的 packageManager 字段，
      # 避免与此处写死的版本冲突（ERR_PNPM_BAD_PM_VERSION）
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            src-web/pnpm-lock.yaml

      # --- Rust ---
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # --- Linux 系统库（GTK + WebKit，Tauri 编译必需）---
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            rpm

      # --- 安装前端依赖 ---
      - name: Install dependencies
        run: |
          pnpm install
          cd src-web && pnpm install

      # --- 使用 pnpm tauri build 构建 ---
      # build.rs 会自动构建 src-web 前端并嵌入到可执行程序
      # bundle 类型取自 matrix.bundles，CI 不依赖 tauri.conf.json 的 "targets": "all"
      - name: Build (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: pnpm tauri build -v -t ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # Linux: 构建 deb + rpm 包
      - name: Build (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: pnpm tauri build -v -t ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # Windows: 只产裸 exe
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: pnpm tauri build -v -t ${{ matrix.target }} --no-bundle

      # --- 检查 bundle 输出（确认打包产物是否生成）---
      - name: List bundle output
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "=== Bundle output ==="
          find "target/${{ matrix.target }}/release/bundle" -type f 2>/dev/null || echo "(no bundle files)"

      # --- UPX 压缩（仅 Windows，减小 .exe 体积）---
      - name: Install UPX
        if: runner.os == 'Windows'
        shell: bash
        run: choco install upx -y

      - name: Compress binary with UPX
        if: runner.os == 'Windows'
        shell: bash
        run: |
          BINARY="target/${{ matrix.target }}/release/lan-share${{ matrix.ext }}"
          SIZE_BEFORE=$(wc -c < "$BINARY")
          echo "Size before UPX: $SIZE_BEFORE bytes"
          if upx --best --lzma "$BINARY"; then
            SIZE_AFTER=$(wc -c < "$BINARY")
            echo "UPX compressed: $SIZE_BEFORE → $SIZE_AFTER bytes (saved $(( SIZE_BEFORE - SIZE_AFTER )) bytes)"
          else
            echo "::warning::UPX compression failed, uploading uncompressed binary"
          fi

      # --- 上传原始可执行文件（仅 Windows，直接分发 .exe）---
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: lan-share_${{ matrix.name }}
          path: target/${{ matrix.target }}/release/lan-share${{ matrix.ext }}
          compression-level: 0

      # --- 上传 DMG ---
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: lan-share_${{ matrix.name }}-dmg
          path: target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          compression-level: 0
          if-no-files-found: warn

      # --- 上传 deb + rpm（Linux 额外上传两种包格式）---
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: lan-share_${{ matrix.name }}-deb
          path: target/${{ matrix.target }}/release/bundle/deb/*.deb
          compression-level: 0
          if-no-files-found: warn

      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: lan-share_${{ matrix.name }}-rpm
          path: target/${{ matrix.target }}/release/bundle/rpm/*.rpm
          compression-level: 0
          if-no-files-found: warn

  release:
    name: Fill release draft
    runs-on: ubuntu-latest
    needs: [validate, build]
    if: needs.validate.outputs.fill == 'true'
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release-assets

          for dir in all-artifacts/*/; do
            artifact_name="$(basename "$dir")"          # e.g. "lan-share_windows-x86_64"
            platform_part="${artifact_name#lan-share_}"  # e.g. "windows-x86_64"

            # 每个 artifact 目录里都是待转发的包文件，统一按平台重命名后打包
            for file in "$dir"/*; do
              [ -f "$file" ] || continue
              case "$platform_part" in
                windows-x86_64)
                  zip_name="lan-share_windows-x86_64.zip"
                  echo "Zipping → ${zip_name}"
                  zip -j "${GITHUB_WORKSPACE}/release-assets/${zip_name}" "$file"
                  ;;
                macos-*-dmg)
                  plat="${platform_part%-dmg}"
                  zip_name="lan-share_${plat}.dmg.zip"
                  echo "Zipping → ${zip_name}"
                  zip -j "${GITHUB_WORKSPACE}/release-assets/${zip_name}" "$file"
                  ;;
                linux-*-deb)
                  plat="${platform_part%-deb}"
                  zip_name="lan-share_${plat}.deb.zip"
                  echo "Zipping → ${zip_name}"
                  zip -j "${GITHUB_WORKSPACE}/release-assets/${zip_name}" "$file"
                  ;;
                linux-*-rpm)
                  plat="${platform_part%-rpm}"
                  zip_name="lan-share_${plat}.rpm.zip"
                  echo "Zipping → ${zip_name}"
                  zip -j "${GITHUB_WORKSPACE}/release-assets/${zip_name}" "$file"
                  ;;
              esac
            done
          done

          echo "=== Release assets ==="
          ls -lh release-assets/

      # 只传 tag_name 与 files：标题、notes、prerelease 沿用你在网页草稿里填的内容。
      # draft 显式传 true，否则 action 上传完会自动把草稿发布出去。
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          files: release-assets/*
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
