[package]
name = "lan-share"
version = "1.1.1"
description = "A Tauri App"
authors = ["somunsm"]
edition = "2021"

[lib]
name = "lan_share_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# 颜色库
colored = "3.0.0"
# 日志
log = "0.4.28"
# 日志实现
env_logger = "0.11.8"
# 日期时间处理库
chrono = "0.4.42"
# 异步运行时
tokio = { version = "1.46.1", features = ["rt", "rt-multi-thread", "macros", "fs", "net", "sync"] }
# 获取机器内网IP

# 本地宏
local-ip-address = "0.6.5"
# 支持跨平台获取相关路径位置
directories = "6.0.0"
# SQLx 用于操作 SQL Lite
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "sqlite", "macros", "migrate"] }

# Http库（支持 HttpClient / HttpServer）
hyper = { version = "1.6.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.16", features = ["tokio", "server-auto"] }
# Http请求/响应体工具
http-body-util = "0.1.3"
# 序列化
serde = { version = "1.0.228", features = ["derive"] }
# JSON序列化
serde_json = "1.0"
# HTTP 客户端（检查更新用）
reqwest = { version = "0.12", features = ["json"] }
# 解析 multipart 数据
multer = "2.1"
# 解析Form表单的url编码
form_urlencoded = "1.2.2"
# 用于处理流的 map 操作
futures-util = "0.3.31"
lazy_static = "1.4.0"
# HttpServer的路径处理器宏
lan-share-http-macros = { workspace = true }
mime_guess = "2.0.5"
# 获取磁盘可用空间
fs4 = { version = "0.13", features = ["tokio"] }
listeners = "0.5"
ctor = "0.6.0"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
dirs = "6"
regex = "1"
trash = "5"
image = "0.25"
# 文本编码检测与转码（预览 GBK 文本）
encoding_rs = "0.8"
sha2 = "0.10"
base64 = "0.22"


[target.'cfg(windows)'.dependencies]
winreg = "0.52"
arboard = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
arboard = "3"

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3", features = ["wl-clipboard-rs", "wayland-data-control"] }
