[package]
name = "lan-share"
version = "0.1.0"
description = "A Tauri App"
authors = ["somunsm"]
edition = "2021"

[lib]
name = "lan_share_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# 颜色库
colored = "3.0.0"
# 日志
log = "0.4.28"
# 日志实现
env_logger = "0.11.8"
# 日期时间处理库
chrono = "0.4.42"
# 异步运行时
tokio = { version = "1.46.1", features = ["full"] }
# 打包目录文件
include_dir = "0.7.4"
# 获取机器内网IP

# 本地宏
local-ip-address = "0.6.5"
# 支持跨平台获取相关路径位置
directories = "6.0.0"
# SQLx 用于操作 SQL Lite
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "sqlite", "macros", "migrate"] }

# Http库（支持 HttpClient / HttpServer）
hyper = { version = "1.6.0", features = ["full"] }
hyper-util = { version = "0.1.16", features = ["full"] }
# Http请求/响应体工具
http-body-util = "0.1.3"
# 序列化
serde = { version = "1.0.228", features = ["derive"] }
# JSON序列化
serde_json = "1.0"
# 解析 multipart 数据
multer = "2.1"
# 解析Form表单的url编码
form_urlencoded = "1.2.2"
# 用于处理流的 map 操作
futures-util = "0.3.31"
lazy_static = "1.4.0"
# HttpServer的路径处理器宏
lan-share-http-macros = { workspace = true }
mime_guess = "2.0.5"
ctor = "0.6.0"
tauri-plugin-single-instance = "2"
